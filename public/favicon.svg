<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SaraLearn">
  <!-- Tuile vert SaraLearn (--sc-primary). Le S est en Newsreader dans
       l'app ; ici on demande une serif largement installée, le fichier
       devant se suffire à lui-même : un favicon ne charge pas de police
       distante. Le point doré reprend celui du wordmark « SaraLearn. » -->
  <rect width="64" height="64" rx="15" fill="#0a5c2c"/>
  <text x="30" y="45.5"
        font-family="Newsreader, Georgia, 'Times New Roman', Times, serif"
        font-size="42" font-weight="600" fill="#ffffff"
        text-anchor="middle">S</text>
  <circle cx="50" cy="42" r="4" fill="#c8932e"/>
</svg>
