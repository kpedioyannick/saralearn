<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)" />
    <!-- En anglais, la langue par défaut de l'app : c'est ce que lisent les
         robots, qui n'exécutent pas toujours le script. `App.tsx` les
         réécrit dans la langue choisie dès le premier rendu. -->
    <meta name="description" content="SaraLearn — Making learning simple, open and endless." />
    <title>SaraLearn — endless learning</title>
    <!-- Le SVG sert les navigateurs récents ; le PNG 32 reste là pour
         ceux qui l'ignorent, et l'icône Apple pour l'écran d'accueil
         iOS, qui n'accepte pas de SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
